<svg width="1111" height="1087" viewBox="0 0 1111 1087" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
  /* Whole character: gentle curious sway */
  #Find {
    transform-box: fill-box;
    transform-origin: center;
    animation: discover-sway 3.8s ease-in-out infinite;
  }

  /* Eyes: soft blink */
  #eye-left,
  #eye-right {
    transform-box: fill-box;
    transform-origin: center;
    animation: discover-blink 5.2s ease-in-out infinite;
  }

  #eye-right {
    animation-delay: 0.035s;
  }

  /* Discovery accents: small alternating pop */
  #accent-1,
  #accent-2 {
    transform-box: fill-box;
    transform-origin: center;
  }

  #accent-1 {
    animation: discover-accent-one 2.8s ease-in-out infinite;
  }

  #accent-2 {
    animation: discover-accent-two 2.8s ease-in-out infinite;
  }

  @keyframes discover-sway {
    0%,
    100% {
      transform: translateY(0px) rotate(0deg);
    }

    28% {
      transform: translateY(-6px) rotate(-1deg);
    }

    55% {
      transform: translateY(-10px) rotate(1.1deg);
    }

    78% {
      transform: translateY(-4px) rotate(-0.45deg);
    }
  }

  @keyframes discover-blink {
    0%,
    39%,
    42%,
    72%,
    75%,
    100% {
      transform: scaleY(1);
    }

    40.5%,
    73.5% {
      transform: scaleY(0.08);
    }
  }

  @keyframes discover-accent-one {
    0%,
    100% {
      transform: scale(1) rotate(0deg);
      opacity: 0.9;
    }

    45% {
      transform: scale(1.12) rotate(-3deg);
      opacity: 1;
    }
  }

  @keyframes discover-accent-two {
    0%,
    100% {
      transform: scale(1) rotate(0deg);
      opacity: 0.88;
    }

    55% {
      transform: scale(1.1) rotate(3deg);
      opacity: 1;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    #Find,
    #eye-left,
    #eye-right,
    #accent-1,
    #accent-2 {
      animation: none !important;
    }
  }
</style>
