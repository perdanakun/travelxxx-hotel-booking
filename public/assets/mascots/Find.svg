<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
  #Disover {
    transform-box: fill-box;
    transform-origin: center;
    animation: mascot-sway 3.5s ease-in-out infinite;
  }

  #eye-left,
  #eye-right {
    transform-box: fill-box;
    transform-origin: center;
    animation: mascot-blink 4.8s ease-in-out infinite;
  }

  #eye-right {
    animation-delay: 0.04s;
  }

  #pupil,
  #pupil_2 {
    transform-box: fill-box;
    transform-origin: center;
    animation: mascot-look 5.8s ease-in-out infinite;
  }

  #accent-1,
  #accent-2 {
    transform-box: fill-box;
    transform-origin: center;
    animation: accent-pop 2.6s ease-in-out infinite;
  }

  #accent-2 {
    animation-delay: 0.25s;
  }

  @keyframes mascot-sway {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    25% { transform: translateY(-6px) rotate(-1deg); }
    50% { transform: translateY(-10px) rotate(1deg); }
    75% { transform: translateY(-4px) rotate(-0.45deg); }
  }

  @keyframes mascot-blink {
    0%, 41%, 43%, 73%, 75%, 100% { transform: scaleY(1); }
    42% { transform: scaleY(0.08); }
    74% { transform: scaleY(0.18); }
  }

  @keyframes mascot-look {
    0%, 16%, 100% { transform: translate(0, 0); }
    28%, 40% { transform: translate(2px, 1px); }
    58%, 68% { transform: translate(-1.5px, 0); }
  }

  @keyframes accent-pop {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.08); opacity: 0.85; }
  }

  @media (prefers-reduced-motion: reduce) {
    #Disover, #eye-left, #eye-right, #pupil, #pupil_2, #accent-1, #accent-2 {
      animation: none !important;
    }
  }
</style>
